name: Discord Webhook Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test LOG webhook
        env:
          WH: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          url=(os.getenv("WH") or "").strip()
          if url.startswith("{"):
              try: url=json.loads(url).get("url","").strip()
              except: pass
          if len(url)>=2 and url[0]=='"' and url[-1]=='"':
              url=url[1:-1].strip()
          if not url: raise SystemExit("missing webhook")
          data=json.dumps({"content":"✅ Discord test LOG"}).encode("utf-8")
          req=urllib.request.Request(url, data=data, headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=15) as r:
              print("status:", r.status)
          PY
