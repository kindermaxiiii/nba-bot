name: NBA Bot

on:
  schedule:
    - cron: "30 16 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (full history for safe rebase)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Build team features (balldontlie key)
      - name: Build team features
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python build_team_features.py

      # ✅ Run bot
      - name: Run bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_TEAM_WEBHOOK: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
          DISCORD_PROPS_WEBHOOK: ${{ secrets.DISCORD_PROPS_WEBHOOK }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: python main.py

      # ✅ ULTRA STABLE COMMIT+PUSH (no merge conflicts)
      - name: Commit + Push (ultra-stable)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"

          # Always sync first to avoid conflicts
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Re-add the updated files from this run
          git add -A state.json data/team_features.json || true

          # If nothing changed, stop here
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update state & team features"

          # Push with retries (handles transient failures)
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            if git push origin HEAD:main; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed, retrying after sync..."
            sleep $((i*2))
            git fetch origin main
            git rebase origin/main || (git rebase --abort && git reset --hard origin/main)
          done

          echo "Push failed after retries."
          exit 1
