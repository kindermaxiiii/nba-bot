name: NBA Bot (DEBUG WEBHOOKS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug_webhooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check secrets are present (do NOT print values)
        env:
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
          DISCORD_TEAM_WEBHOOK: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
          DISCORD_PROPS_WEBHOOK: ${{ secrets.DISCORD_PROPS_WEBHOOK }}
        run: |
          set -e
          echo "LOG set?  $([ -n "$DISCORD_LOG_WEBHOOK" ] && echo YES || echo NO)"
          echo "TEAM set? $([ -n "$DISCORD_TEAM_WEBHOOK" ] && echo YES || echo NO)"
          echo "PROPS set? $([ -n "$DISCORD_PROPS_WEBHOOK" ] && echo YES || echo NO)"

      - name: Send TEST to DISCORD_LOG_WEBHOOK
        env:
          URL: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: |
          set -e
          if [ -z "$URL" ]; then echo "DISCORD_LOG_WEBHOOK is empty"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"TEST LOG OK (from GitHub Actions)"}' \
            "$URL")
          echo "HTTP=$CODE (expected 204)"

      - name: Send TEST to DISCORD_TEAM_WEBHOOK
        env:
          URL: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
        run: |
          set -e
          if [ -z "$URL" ]; then echo "DISCORD_TEAM_WEBHOOK is empty"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"TEST TEAM OK (from GitHub Actions)"}' \
            "$URL")
          echo "HTTP=$CODE (expected 204)"

      - name: Send TEST to DISCORD_PROPS_WEBHOOK
        env:
          URL: ${{ secrets.DISCORD_PROPS_WEBHOOK }}
        run: |
          set -e
          if [ -z "$URL" ]; then echo "DISCORD_PROPS_WEBHOOK is empty"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"TEST PROPS OK (from GitHub Actions)"}' \
            "$URL")
          echo "HTTP=$CODE (expected 204)"
