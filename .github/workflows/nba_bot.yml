name: NBA Bot (TEST DISCORD)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-bot-test
  cancel-in-progress: false

jobs:
  test_discord:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TEST Discord LOG webhook (should post "TEST DISCORD OK")
        env:
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: python -c "from context import post_discord_log; post_discord_log('TEST DISCORD OK')"

      - name: TEST Discord TEAM webhook (should post "TEST TEAM OK")
        env:
          DISCORD_TEAM_WEBHOOK: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
        run: python -c "from context import post_discord_team; post_discord_team('TEST TEAM OK')"

      - name: TEST Discord PROPS webhook (should post "TEST PROPS OK")
        env:
          DISCORD_PROPS_WEBHOOK: ${{ secrets.DISCORD_PROPS_WEBHOOK }}
        run: python -c "from context import post_discord_props; post_discord_props('TEST PROPS OK')"
