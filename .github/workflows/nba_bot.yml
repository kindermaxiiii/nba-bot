name: NBA Bot (DEBUG RUN)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: DEBUG 0 — Discord ping (pre-checkout)
        env:
          URL: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: |
          set -e
          if [ -z "$URL" ]; then echo "DISCORD_LOG_WEBHOOK empty"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"🟦 NBA BOT DEBUG: workflow started (pre-checkout)"}' \
            "$URL")
          echo "Discord HTTP=$CODE (expected 204)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: DEBUG 1 — List repo files
        run: |
          ls -la
          echo "----"
          find . -maxdepth 2 -type f | sed 's|^\./||'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DEBUG 2 — Discord ping (post-install)
        env:
          URL: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"🟩 NBA BOT DEBUG: deps installed, about to run main.py"}' \
            "$URL")
          echo "Discord HTTP=$CODE (expected 204)"

      - name: Run bot (main.py)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          DISCORD_TEAM_WEBHOOK: ${{ secrets.DISCORD_TEAM_WEBHOOK }}
          DISCORD_PROPS_WEBHOOK: ${{ secrets.DISCORD_PROPS_WEBHOOK }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: python main.py
