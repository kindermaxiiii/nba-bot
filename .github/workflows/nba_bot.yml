name: Discord Webhook Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post test message to Discord (URL hardcoded)
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          # ⚠️ Remplace cette URL par TON webhook de #nba-test (salon texte normal, pas thread/forum)
          url = "PASTE_WEBHOOK_URL_HERE".strip()

          payload = {"content": "✅ TEST OK: GitHub Actions -> Discord webhook fonctionne."}
          data = json.dumps(payload).encode("utf-8")

          req = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print("SUCCESS HTTP", resp.status)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="ignore")
              print("HTTPERROR", e.code)
              if body:
                  print("BODY:", body[:1000])
              raise
          except Exception as e:
              print("FAILED:", repr(e))
              raise
          PY
